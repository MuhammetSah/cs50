<!DOCTYPE html>

<html lang="en">
    <head>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500&display=swap" rel="stylesheet">
        <link href="styles.css" rel="stylesheet">
        <title>Trivia!</title>
        <script>
            // TODO: Add code to check answers to questions
            // Wait for DOM to load the site
            document.addEventListener('DOMContentLoaded', function() {
                // Get all elements with calls .correct
                let corrects = document.querySelectorAll('.correct');

                // Change the color of correct answers
                for (let i = 0; i < corrects.length; i++) {
                    corrects[i].addEventListener('click', function() {
                        // Set the correct answer to green
                        corrects[i].style.backgroundColor = 'Green';

                        // Find the element with feedback1 and print out Correct!
                        corrects[i].parentElement.querySelector('.feedback').innerHTML = 'Correct!';
                });
            }

            // Getting the responses for incorrect answers
            let incorrects = document.querySelectorAll(".incorrect");

            // Change the color of incorrect answers
            for (let i = 0; i < incorrects.length; i++) {
                    incorrects[i].addEventListener('click', function() {

                    // Set the incorrect answers to red
                    incorrects[i].style.backgroundColor = 'Red';

                    // Find the first element with feedback 2 and print out Incorrect!
                    incorrects[i].parentElement.querySelector('.feedback').innerHTML = 'Incorrect';
                });
            }

            // Check the correct answer for Part 2
            document.querySelector('#check').addEventListener('click', function() {
                let input = document.querySelector('input');
                if (input.value === "Tokyo") {
                        input.style.background = "Green";
                        input.parentElement.querySelector('.feedback').innerHTML = 'Correct!';
                    }
                else {
                    input.style.background = "Red";
                    input.parentElement.querySelector('.feedback').innerHTML = 'Incorrect';
                }
            });
            });
        </script>
    </head>
    <body>
        <div class="header">
            <h1>Trivia!</h1>
        </div>

        <div class="container">
            <div class="section">
                <h2>Part 1: Multiple Choice </h2>
                <hr>
                <!-- TODO: Add multiple choice question here -->
                 <h3>What is the approximate speed of light?</h3>

                 <button class = "correct">300,000 km/s</button>
                 <button class = "incorrect">30,000 km/s</button>
                 <button class = "incorrect">3,000,000 km/s</button>
                 <button class = "incorrect">300,000,000 km/s</button>

                 <p class ="feedback"></p>
            </div>

            <div class="section">
                <h2>Part 2: Free Response</h2>
                <hr>
                <!-- TODO: Add free response question here -->
                 <h3>What is the capital of Japan?</h3>

                 <input type="text" placeholder="Type in a capital">
                 <button id = "check">Check answer</button>
                 <p class ="feedback"></p>
            </div>
        </div>
    </body>
</html>
